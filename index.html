<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M. Saraswathi | Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    scroll-behavior: smooth;
}

body {
    background: linear-gradient(135deg, #fce4ec, #e1d5ff, #d6f3ff);
    color: #39304d;
}

/* Navigation */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 9%;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #9254b9;
}

nav a {
    text-decoration: none;
    color: #554269;
    margin-left: 22px;
    font-weight: bold;
}

/* Home */
.home {
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
}

.home-content {
    background: rgba(255,255,255,0.55);
    padding: 55px 35px;
    border-radius: 30px;
    box-shadow: 0 10px 35px #a78bc555;
    max-width: 750px;
}

.home h1 {
    font-size: 45px;
    color: #8748ad;
    margin-bottom: 15px;
}

.home h2 {
    color: #db69a5;
    margin-bottom: 20px;
}

.home p {
    font-size: 17px;
    line-height: 1.8;
}

.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 13px 30px;
    background: linear-gradient(90deg, #bd76d9, #ed88b5);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-5px);
}

/* Common sections */
section {
    padding: 65px 10%;
    text-align: center;
}

.section-title {
    font-size: 32px;
    color: #8748ad;
    margin-bottom: 30px;
}

/* About */
.about-box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    line-height: 2;
    box-shadow: 0 8px 25px #b9a4ce55;
}

/* Skills */
.skills-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

.skill {
    padding: 25px 35px;
    background: white;
    border-radius: 20px;
    font-size: 19px;
    font-weight: bold;
    color: #8b50ad;
    box-shadow: 0 6px 18px #b9a4ce55;
    transition: 0.3s;
}

.skill:hover {
    transform: translateY(-8px);
    background: #f8e5fa;
}

/* Contact */
.contact-box {
    background: rgba(255,255,255,0.75);
    padding: 35px;
    border-radius: 25px;
    line-height: 2.5;
    box-shadow: 0 8px 25px #b9a4ce55;
}

.contact-box a {
    color: #9a55bd;
    text-decoration: none;
    font-weight: bold;
}

/* Footer */
footer {
    text-align: center;
    padding: 25px;
    background: #8d60a9;
    color: white;
}

/* Mobile */
@media(max-width:600px) {
    nav {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 5px;
        font-size: 14px;
    }

    .home h1 {
        font-size: 32px;
    }

    .home-content {
        padding: 35px 20px;
    }

    .section-title {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<!-- Navigation -->
<nav>
    <div class="logo">Saraswathi.</div>
    <div>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<!-- Home -->
<section class="home" id="home">
    <div class="home-content">
        <h2>✨ Welcome to My Portfolio ✨</h2>
        <h1>Hi, I'm M. Saraswathi</h1>
        <h2>B.Tech Information Technology</h2>
        <p>
            First Year Student | Future IT Professional
            <br>
            Passionate about learning new technologies
            and building creative digital experiences.
        </p>
        <a href="#about" class="btn">Explore More →</a>
    </div>
</section>
